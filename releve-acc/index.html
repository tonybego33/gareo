<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1F24">
<title>GARÉo Relevé ACC</title>
<link rel="manifest" href="manifest.webmanifest?v=5">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Manrope:wght@800&display=swap" rel="stylesheet">
<link rel="icon" href="gareo-192.png">
<link rel="apple-touch-icon" href="gareo-apple-180.png">
<style>:root{--ink:#1B1F24;--ink2:#3A4048;--mute:#6B7280;--line:#E2E5E9;--bg:#F2F3F5;--paper:#FFFFFF;--acc:#0A6A87;--acc2:#E6F1F5;--red:#C8102E;--grn:#2E8B57;--org:#C98A00;--blue:#0A6A87;--tint:#E6F1F5;--yel:#0A6A87;--navy:#1B1F24}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Lato,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
header{position:sticky;top:0;z-index:20;background:#1B1F24;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));min-height:56px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;border:0;background:rgba(255,255,255,.08);color:#fff;flex-shrink:0;text-decoration:none}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{background:rgba(255,255,255,.16)}.ib.dark{background:#F2F3F5;color:var(--ink)}
header .brand{display:flex;align-items:center;gap:10px;margin-right:auto;font-weight:700;font-size:16px}
header .glogo{height:30px;width:auto;display:block}
header .ttl{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
header .ttl b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header .ttl small{font-size:12px;opacity:.65}
header .tabs{display:flex;gap:4px;background:rgba(255,255,255,.06);border-radius:12px;padding:4px}
header .tabs button,#bnav button{display:flex;align-items:center;gap:7px;border:0;background:transparent;color:rgba(255,255,255,.75);border-radius:9px;padding:7px 14px;font-weight:700;font-size:14px}
header .tabs button svg,#bnav button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header .tabs button.on{background:#fff;color:var(--ink)}
#bnav{display:none}
@media (max-width:760px){header .tabs{display:none}
  body.in-gare #bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  #bnav button{flex:1;flex-direction:column;gap:2px;color:var(--mute);font-size:12px;padding:6px 0}#bnav button.on{color:var(--acc)}
  body.in-gare main{padding-bottom:100px}}
main{max-width:1180px;margin:0 auto;padding:14px 12px 90px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card.empty{text-align:center;padding:40px 20px}
h1{font-size:24px;font-weight:900;margin:6px 0 16px;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 8px;font-weight:900}
h3{font-size:15px;margin:4px 0 8px;font-weight:700}
.mute{color:var(--mute)}.small{font-size:13px}
.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;min-height:44px;text-align:center;color:var(--ink);font-weight:700}
.btn:hover{border-color:#C9CED4}
.btn.big{min-height:56px;font-size:16px}
.btn.huge{min-height:104px;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.btn.huge svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.btn.huge .big{font-size:26px;line-height:1}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.yel{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.red{color:var(--red);border-color:#F1C7CE}
.btn:disabled{opacity:.4;cursor:default}
.lnk{border:0;background:none;color:var(--acc);font-weight:700;padding:4px 0}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px;min-height:36px;color:var(--ink)}
.chip small{color:var(--mute);font-weight:700}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.chip.on small{color:rgba(255,255,255,.7)}
.chip.att.on{background:var(--grn);border-color:var(--grn)}.chip.agg.on{background:var(--red);border-color:var(--red)}.chip.eva.on{background:var(--org);border-color:var(--org)}
.chip.star.on{background:var(--org);color:#fff;border-color:var(--org)}
.chip.sel{background:var(--acc2);border-color:var(--acc);color:var(--ink);font-weight:700}
.chip .x{font-weight:700;opacity:.6;margin-left:2px}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px;font-weight:700}
.banner{background:#FFF7E0;border:1px solid #F0DDA0;border-radius:10px;padding:9px 12px;margin:10px 0;font-size:13.5px}
.banner.ok{background:#EAF6EF;border-color:#BFE3CE}.banner.err{background:#FDECEE;border-color:#F4BEC6}
.imp{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 5px;white-space:nowrap}
.imp4{background:#FBE1E4;color:#A8102A}.imp3{background:#FDEBD7;color:#A5591A}.imp2{background:#EEF0D6;color:#6A6A1D}.imp1{background:#EEF1F4;color:#55606B}
/* mes gares */
.home{max-width:760px;margin:0 auto}.home.narrow{max-width:620px}
.glist{display:grid;gap:12px}
.gcard{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;transition:border-color .15s,box-shadow .15s}
.gcard:hover{border-color:var(--acc);box-shadow:0 6px 18px rgba(10,106,135,.12)}
.gcard .cv{width:104px;height:78px;border-radius:11px;overflow:hidden;flex-shrink:0;background:var(--acc2);display:flex;align-items:center;justify-content:center}
.gcard .cv img{width:100%;height:100%;object-fit:cover}.gcard .cv img.pl{object-fit:cover;object-position:40% 45%;transform:scale(1.6)}
.gcard .cv .ph{font-size:34px;color:var(--acc);font-weight:300}.gcard .cv .ph svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.8}
.gcard .gi{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.gcard .gc{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--acc)}
.gcard b{font-size:19px;font-weight:900}.gcard .gm{font-size:13px;color:var(--mute)}
.gcard .go{font-size:28px;color:#B8BEC6;padding:0 6px}
.gcard.add{border-style:dashed;border-width:2px;background:transparent}.gcard.add .cv{background:#fff;border:1px dashed #C9CED4}
#gate{position:fixed;inset:0;z-index:100;background:#1B1F24;display:flex;align-items:center;justify-content:center;padding:20px}
.gbox{background:#fff;border-radius:16px;padding:28px 26px;width:min(380px,100%);display:flex;flex-direction:column}
.gbox .glogo{height:40px;width:auto;align-self:flex-start;background:#1B1F24;border-radius:8px;padding:6px 10px;box-sizing:content-box}
.gbox .gt{font-size:22px;font-weight:900;margin:14px 0 2px}.gbox p{margin:0 0 6px;color:var(--mute);font-size:14px}.gbox .btn{margin-top:16px}
.gerr{color:var(--red);font-size:13.5px;min-height:18px;margin-top:8px;font-weight:700}.gback{margin-top:14px;font-size:13px;text-align:center;color:var(--mute)}
.card.share{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-color:var(--acc);background:var(--acc2)}
.plrow{display:flex;gap:10px;align-items:center;margin-bottom:8px}.plrow img{width:84px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex-shrink:0;background:#fff}
/* terrain */
.cap{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.hint{margin:10px 2px 12px}
/* export */
.xgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.xc{display:flex;flex-direction:column;gap:10px;margin:0}.xc h2{margin:0}.xc p{margin:0;flex:1}.xc .xi{font-size:28px}
/* bureau */
.bw{display:grid;grid-template-columns:360px 1fr;gap:14px;align-items:start}
.bw.narrow{grid-template-columns:1fr}
.bl{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;position:sticky;top:70px;max-height:calc(100vh - 84px);display:flex;flex-direction:column}
.bw.narrow .bl{position:static;max-height:none}
.bfil{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.bfil .chip{min-height:32px;padding:4px 10px;font-size:13px}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:8px}
.seg2 button{border:0;background:transparent;border-radius:8px;padding:7px;font-weight:700;font-size:13px;color:var(--mute)}.seg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bscroll{overflow:auto;flex:1}
.bz{margin-bottom:10px}.bzh{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 2px;border-bottom:1px solid var(--line);margin-bottom:6px}.bzh span{color:var(--mute);white-space:nowrap}
.bth{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:5px}
.bth .t{position:relative;border:2px solid transparent;border-radius:8px;padding:0;overflow:hidden;background:#DDE1E6;aspect-ratio:1}
.bth .t img{width:100%;height:100%;object-fit:cover;display:block}.bth .t.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.bth .n{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.62);color:#fff;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 4px}
.bth .ef{position:absolute;right:3px;top:3px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px #fff}.ef.agg{background:var(--red)}.ef.att{background:var(--grn)}.ef.eva{background:var(--org)}
.bth .td{position:absolute;left:3px;top:3px;width:9px;height:9px;border-radius:2px;background:#fff;box-shadow:inset 0 0 0 2px var(--org)}
.bth .st{position:absolute;right:3px;bottom:2px;color:#F2B705;font-style:normal;font-size:13px;text-shadow:0 0 3px #000}
.bmapw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;height:min(56vh,520px)}.bmap{position:relative}.bmap img{width:100%;display:block}
.bmap .mk{position:absolute;transform:translate(-50%,-50%);min-width:22px;height:20px;border-radius:10px;border:2px solid #fff;background:#1B1F24;color:#fff;font-size:10px;font-weight:900;padding:0 4px;line-height:16px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.bmap .mk.agg{background:var(--red)}.bmap .mk.att{background:var(--grn)}.bmap .mk.eva{background:var(--org)}.bmap .mk.sel{outline:3px solid var(--acc);z-index:2;transform:translate(-50%,-50%) scale(1.25)}
.br{min-width:0}
.bnav{display:flex;align-items:center;gap:10px;margin-bottom:10px}.bnav .bt{flex:1;text-align:center;display:flex;flex-direction:column}.bnav .bt span{font-size:12.5px;color:var(--mute)}
.bph{background:#111;border-radius:14px;overflow:hidden;margin-bottom:12px;cursor:zoom-in;display:flex;align-items:center;justify-content:center;min-height:200px}
.bph img{max-width:100%;max-height:52vh;display:block}.bph .ph0{color:#fff;padding:60px 20px;font-weight:700}
/* paramètres */
.sheet-bg{position:fixed;inset:0;background:rgba(15,18,22,.45);z-index:60}
.sheet{position:fixed;z-index:61;right:0;top:0;bottom:0;width:min(440px,100%);background:#fff;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}.sheet .sh b{font-size:18px;font-weight:900}
.sheet .sb{overflow:auto;padding:4px 16px 30px}
.sheet section{padding:14px 0;border-bottom:1px solid var(--line)}.sheet section:last-child{border-bottom:0}.sheet h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}.vrow.on{border-color:var(--acc);background:var(--acc2)}
.vrow .btn{min-height:36px;padding:6px 10px}
/* galerie */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.gal .it{position:relative;border-radius:10px;overflow:hidden;background:#DDE1E6;border:2px solid transparent;cursor:pointer}
.gal .it img,.gal .it .ph0{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.gal .it .ph0{display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;background:#2a3440}
.gal .it .lb{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:10.5px;padding:12px 5px 4px;line-height:1.15}
.gal .it .bd{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;border-radius:5px;padding:1px 5px}
.gal .it .todo{position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.gal .it.sel{border-color:var(--acc)}
/* overlay fiche */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.ov .top{background:#1B1F24;color:#fff;display:flex;align-items:center;gap:8px;padding:9px 10px;padding-top:calc(9px + env(safe-area-inset-top))}
.ov .top b{margin-right:auto;font-size:15px;font-weight:800}
.ov .top button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:8px 11px}
.ov .body{flex:1;overflow:auto;padding:10px}
.ov .foot{padding:9px 10px;display:flex;gap:8px;background:#fff;border-top:1px solid var(--line);padding-bottom:calc(9px + env(safe-area-inset-bottom))}
.ov .foot .btn{flex:1}
.prev{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.prev img,.prev .ph0{width:112px;height:84px;object-fit:cover;border-radius:9px;background:#dde2e8;flex:0 0 auto}
.prev .ph0{display:flex;align-items:center;justify-content:center;font-size:30px;background:#2a3440;color:#fff}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.nivtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.nivtabs .chip{flex:0 0 auto}
.planbox{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.planwrap{position:relative;overflow:auto;height:40vh;min-height:230px;background:#fff}
.planwrap img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
.pctl{display:flex;gap:6px;padding:6px;border-top:1px solid var(--line);background:#F7F8FA;align-items:center;flex-wrap:wrap}
.pctl .chip{min-height:34px;padding:5px 10px}
.pin{position:absolute;width:0;height:0;pointer-events:none}
.pin i{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px #fff,0 1px 6px rgba(0,0,0,.5)}
.pin b{position:absolute;left:0;top:-2px;width:46px;height:4px;background:var(--red);transform-origin:0 50%;border-radius:2px;box-shadow:0 0 0 1px #fff}
.pin b::after{content:"";position:absolute;right:-6px;top:-5px;border-left:10px solid var(--red);border-top:7px solid transparent;border-bottom:7px solid transparent}
.dot{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--blue);opacity:.55;pointer-events:none;box-shadow:0 0 0 1px #fff}
.full{position:fixed;inset:0;z-index:80;background:#000;display:flex;align-items:center;justify-content:center}
.full img,.full video{max-width:100%;max-height:100%}
.full button{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:9px 13px}
.ver{display:none;padding:1px 5px;border-radius:4px}
.stat{display:inline-block;margin-right:14px}.stat b{font-size:18px}
.prog{height:8px;background:#E3E7EC;border-radius:9px;overflow:hidden;margin-top:6px}.prog>div{height:100%;background:var(--acc);width:0}
.lbl{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:12px 0 6px}
.lbl:first-child{margin-top:0}
.chip.alc.on{background:color-mix(in srgb,var(--c) 15%,#fff);color:var(--c);border-color:var(--c);font-weight:800}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg3 button{border:0;border-right:1px solid var(--line);background:#fff;padding:10px 4px;min-height:48px;font-weight:700;font-size:14px;color:var(--ink)}
.seg3 button:last-child{border-right:0}.seg3 .agg b{color:#C8102E}.seg3 .att b{color:#2E8B57}.seg3 .eva b{color:#C98A00}
.seg3 .agg.on{background:#C8102E;color:#fff}.seg3 .att.on{background:#2E8B57;color:#fff}.seg3 .eva.on{background:#C98A00;color:#fff}.seg3 .on b{color:#fff}
.srch{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:0 8px}
.srch span{font-size:17px}.srch input{border:0 !important;min-height:46px;font-size:16px;padding:8px 2px;background:transparent;outline:none}
.zgrp{margin-bottom:12px}.zgrp h3{margin:10px 0 6px}
.help li{margin:4px 0}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="app"></main>
<div id="ov"></div>
<div id="set"></div>
<nav id="bnav"></nav>
<div class="ver" id="ver"></div>
<input type="file" id="capP" accept="image/*" capture="environment" hidden>
<input type="file" id="capV" accept="video/*" capture="environment" hidden>
<input type="file" id="imp" accept="image/*,video/*" multiple hidden>
<input type="file" id="fJson" accept=".json,application/json" hidden>
<input type="file" id="fZip" accept=".zip,application/zip" hidden>
<input type="file" id="fApply" accept=".json,application/json" hidden>
<input type="file" id="fMedia" accept="image/*,video/*" multiple hidden>
<input type="file" id="fDir" webkitdirectory multiple hidden>
<input type="file" id="fPlanImg" accept="image/*" multiple hidden>

<script>
'use strict';
/* =====================================================================
   GARÉo Relevé ACC — photo d'abord : on prend la photo, on la pointe sur le
   plan, on la range (zone libre, équipements, aléas, note).
   Fichier unique, aucune dépendance externe, fonctionne hors-ligne.
   ===================================================================== */

function startVisite(gare, code, auteur) {
  const id = uid();

  S.current = id; S.last = null; save(); render();
}
let captureNext = false;
async function onCapture(files, how) {
  if (!files.length) return; const v = ensureVisit(); if (!v) return;
  const created = [];
  for (const f of files) {
    const isVid = /^video\//.test(f.type) || /\.(mp4|mov|3gp|webm)$/i.test(f.name);
    v.seq++; const id = v.code + '_' + pad(v.seq, 4);
    const L = (how === 'import' ? null : S.last) || {};
    const p = {id, bk:v.id + '/' + id, n:v.seq, t:Date.now(), type:isVid ? 'video' : 'photo', how, name:f.name, size:f.size, mime:f.type,
      niv:L.niv || (NIVEAUX[0] && NIVEAUX[0].id) || 'N0', zone:L.zone || '', pt:L.pt ? {n:L.pt.n, x:L.pt.x, y:L.pt.y} : null, eqs:[...(L.eqs || [])],
      al:[], ef:'', star:false, note:'', dl:null, gps:null, exT:null, exGps:null, stored:false};
    v.photos.push(p); save();
    try { await DB.put('blobs', p.bk, f); p.stored = true; }
    catch (e) { toast('Mémoire pleine : copie de secours dans Téléchargements', 'err'); download(id + '_' + f.name, f); p.dl = Date.now(); }
    if (!isVid && /jpe?g/i.test(f.type + f.name)) { try { const ex = parseExif(await f.slice(0, 262144).arrayBuffer());
      if (ex && ex.dto) p.exT = exifTime(ex.dto, ex.off); if (ex && ex.gps) p.exGps = ex.gps; } catch (e) {} }
    if (how === 'import' && p.exT) p.t = p.exT;
    save(); created.push(p);
    if (S.prefs.dlCopy && p.stored && how !== 'import') { try { download(rawName(p), f); p.dl = Date.now(); save(); } catch (e) {} }
    makeThumb(f, isVid).then(tb => tb && DB.put('thumbs', p.bk, tb)).then(() => { if (!UI.ov) renderGal(); else if (UI.fiche === id) refreshPrev(); }).catch(() => {});
    grabGps(id);
  }
  if (created.length === 1) openFiche(created[0].id);
  else { render(); toast(created.length + ' fichiers importés'); }
}
function grabGps(id) { if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => { const p = P(id); if (!p) return;
    p.gps = {lat:+pos.coords.latitude.toFixed(6), lon:+pos.coords.longitude.toFixed(6), acc:Math.round(pos.coords.accuracy)}; save(); },
  () => {}, {enableHighAccuracy:true, timeout:10000, maximumAge:15000}); }
function fileName(p, v) {
  const d = new Date(p.t); const ext = ((p.name || '').match(/\.[A-Za-z0-9]+$/) || [p.type === 'video' ? '.mp4' : '.jpg'])[0].toLowerCase();
  const eq = p.eqs.length ? short(p.eqs[0], 26) + (p.eqs.length > 1 ? '+' + (p.eqs.length - 1) : '') : 'vue-generale';
  return [p.id, pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds()), ascii(p.niv), short(p.zone || 'sans-zone', 26), eq].join('_') + (p.star ? '_IMPORTANT' : '') + ext;
}
function rawName(p) { const d = new Date(p.t); const ext = ((p.name || '').match(/\.[A-Za-z0-9]+$/) || [p.type === 'video' ? '.mp4' : '.jpg'])[0].toLowerCase();

const X = {src:null, all:true, busy:null, last:null, zipSyn:true, zipLog:null, crAll:false, crLog:null};

    ${X.last ? `<div class="banner ok"><b>${esc(X.last.name)}</b> (${(X.last.size / 1e6).toFixed(1)} Mo). <a href="${X.last.url}" target="_blank">Ouvrir l'aperçu</a></div>` : ''}</div>

async function synthIcons(codes) { try { const b = await (await fetch('cr/base.json')).json(); return Object.fromEntries(codes.filter(k => b.icons[k]).map(k => [k, 'data:image/png;base64,' + b.icons[k]])); } catch (e) { return {}; } }
const toDataUrl = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(''); r.readAsDataURL(b); });
async function synthHtmlFor(r, fromBureau) {
  const getThumb = fromBureau ? async p => { const e = B.files[p.id]; if (!e) return null; if (e.thumb) return await (await fetch(e.thumb)).blob(); return await makeThumb(e.file, p.type === 'video'); }
    : p => DB.get('thumbs', bk(p)).catch(() => null);
  const photos = [...r.photos].sort((a, b) => a.n - b.n); const th = {};
  for (const p of photos) { try { const b = await getThumb(p); if (b) th[p.id] = await toDataUrl(b); } catch (e) {} }
  const planData = {}; for (const pl of [...new Set(photos.filter(p => p.pt).map(p => p.pt.n))]) { try { const res = await fetch(PLANS[pl].f); if (res.ok) planData[pl] = await toDataUrl(await res.blob()); } catch (e) {} }
  const icons = await synthIcons([...new Set(photos.flatMap(p => p.al))]);
  return syntheseHtml(r, photos, th, planData, arguments[2] || {}, icons);
}
async function genSynthese() {
  let r, getThumb;
  if (X.src === 'bureau') { r = B.rel; getThumb = async p => { const e = B.files[p.id]; if (!e) return null; if (e.thumb) return await (await fetch(e.thumb)).blob(); return await makeThumb(e.file, p.type === 'video'); }; }
  else { const v = S.visites[X.src]; r = JSON.parse(JSON.stringify(relevePayload(v))); getThumb = p => DB.get('thumbs', bk(p)).catch(() => null); }
  const photos = [...r.photos].sort((a, b) => a.n - b.n);
  X.busy = {lb:'Préparation des vignettes…', done:0, total:photos.length}; render();
  const th = {};
  for (const p of photos) { try { const b = await getThumb(p); if (b) th[p.id] = await toDataUrl(b); } catch (e) {} X.busy.done++; if (X.busy.done % 10 === 0) render(); }
  const plansUsed = [...new Set(photos.filter(p => p.pt).map(p => p.pt.n))]; const planData = {};
  for (const pl of plansUsed) { try { const res = await fetch(PLANS[pl].f); if (res.ok) planData[pl] = await toDataUrl(await res.blob()); } catch (e) {} }
  const icons = await synthIcons([...new Set(photos.flatMap(p => p.al))]);
  const html = syntheseHtml(r, photos, th, planData, {}, icons);
  const name = `${r.visite.code}_synthese_${ymd(r.visite.debut)}.html`;
  const blob = new Blob([html], {type:'text/html'}); download(name, blob);
  if (X.last && X.last.url) URL.revokeObjectURL(X.last.url);
  X.last = {name, size:blob.size, url:URL.createObjectURL(blob)}; X.busy = null; render();
}
function syntheseHtml(r, photos, th, planData, full = {}, icons = {}) {
  const v = r.visite; const zg = groupByZone(photos);
  const alUsed = ALEAS.filter(([k]) => photos.some(p => p.al.includes(k)));
  const byEf = {agg:photos.filter(p => p.ef === 'agg'), att:photos.filter(p => p.ef === 'att'), eva:photos.filter(p => p.ef === 'eva')};
  const stars = photos.filter(p => p.star);
  const EFL = {agg:['Aggravant', '#C8102E', '#FBE4E1'], att:['Atténuant', '#2E8B57', '#E2F2E7'], eva:['À évaluer', '#B07A00', '#FFF4CC'], '':['Sans effet renseigné', '#6B7280', '#F2F3F5']};
  const ico = k => icons[k] ? `<i class="ic i-${k}"></i>` : '';
  const icCss = Object.entries(icons).map(([k, u]) => `.i-${k}{background-image:url(${u})}`).join('');
  const chip = k => `<span class="chip">${ico(k)}${esc(alLabel(k))}</span>`;
  const efTag = k => `<span class="eft" style="--c:${EFL[k || ''][1]};--b:${EFL[k || ''][2]}">${esc(EFL[k || ''][0])}</span>`;
  const zNum = g => pad(zg.indexOf(g) + 1);
  const short = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1).replace(/\s\S*$/, '') + '…' : s; };
  const img = (p, cls = '') => th[p.id] ? `<img class="${cls}" src="${th[p.id]}" alt="Photo n°${p.n}" data-n="${p.n}"${full[p.id] ? ` data-full="${esc(full[p.id].split('/').map(encodeURIComponent).join('/'))}"` : ''}>` : `<div class="noimg ${cls}">${p.type === 'video' ? 'vidéo' : 'pas d\'image'}</div>`;
  /* plan annoté (SVG sur l'image du plan) */
  const mapSvg = (pl, pts, crop) => {
    if (!planData[pl]) return '';
    let vb = `0 0 ${PLAN_W} ${PLAN_H}`;
    if (crop && pts.length) { const xs = pts.map(p => p.pt.x * PLAN_W), ys = pts.map(p => p.pt.y * PLAN_H);
      let x0 = Math.min(...xs) - 260, x1 = Math.max(...xs) + 260, y0 = Math.min(...ys) - 200, y1 = Math.max(...ys) + 200;
      let w = Math.max(x1 - x0, 1100), h = Math.max(y1 - y0, 700); if (w / h > 1.75) h = w / 1.75; else w = h * 1.75;
      const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2; x0 = Math.max(0, Math.min(PLAN_W - w, cx - w / 2)); y0 = Math.max(0, Math.min(PLAN_H - h, cy - h / 2));
      vb = `${x0.toFixed(0)} ${y0.toFixed(0)} ${Math.min(w, PLAN_W).toFixed(0)} ${Math.min(h, PLAN_H).toFixed(0)}`; }
    const grp = new Map(); pts.forEach(p => { const k = p.pt.x.toFixed(3) + '|' + p.pt.y.toFixed(3); if (!grp.has(k)) grp.set(k, []); grp.get(k).push(p); });
    const sc = crop ? 0.8 : 1.2;
    const marks = [...grp.values()].map(xs => { const p0 = xs[0]; const cx = p0.pt.x * PLAN_W, cy = p0.pt.y * PLAN_H;
      const lab = xs.length === 1 ? String(p0.n) : xs[0].n + '–' + xs[xs.length - 1].n; const w = Math.max(46, lab.length * 15 + 18) * sc, h = 44 * sc;
      const ef = xs.some(p => p.ef === 'agg') ? 'agg' : xs.some(p => p.ef === 'att') ? 'att' : xs.some(p => p.ef === 'eva') ? 'eva' : '';

      return `<a href="#p${p0.n}"><g>${arrows}<rect x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${ef ? EFL[ef][1] : '#1B1F24'}" stroke="${xs.some(p => p.star) ? '#F2B705' : '#fff'}" stroke-width="${(xs.some(p => p.star) ? 8 : 5) * sc}"/>
        <text x="${cx}" y="${cy + 9 * sc}" text-anchor="middle" font-size="${25 * sc}" font-weight="900" font-family="Lato,Arial,sans-serif" fill="#fff">${lab}</text><title>${xs.map(p => 'n°' + p.n + ' ' + esc(p.eqs.join(', ') || 'vue générale')).join('\n')}</title></g></a>`; }).join('');
    return `<svg class="map" viewBox="${vb}" preserveAspectRatio="xMidYMid meet"><use href="#plan-${pl}"/>${marks}</svg>`;
  };
  const legend = `<div class="leg"><span><i style="background:#C8102E"></i>aggravant</span><span><i style="background:#2E8B57"></i>atténuant</span><span><i style="background:#B07A00"></i>à évaluer</span><span><i style="background:#1B1F24"></i>sans effet</span><span><i style="background:#fff;box-shadow:0 0 0 2px #F2B705 inset"></i>photo importante</span><span>flèche = direction de prise de vue</span></div>`;
  /* fiche : une photo renseignée */
  const fiche = p => `<article class="fi" id="p${p.n}" style="--c:${EFL[p.ef || ''][1]}">
    <div class="fp">${img(p)}</div>
    <div class="ft"><div class="fh">${efTag(p.ef)}${p.al.map(chip).join('')}<span class="pn">${p.star ? '<b class="st">★</b> ' : ''}Photo n°${p.n} · ${hm(p.t)}</span></div>
      <h4>${p.eqs.length ? esc(p.eqs.join(' · ')) : 'Vue générale'}</h4>
      ${p.note ? `<p>${esc(p.note)}</p>` : '<p class="mute">Pas de note.</p>'}</div></article>`;
  const renseignee = p => p.star || p.ef || p.note || p.al.length;
  const zoneSec = g => { const n = zNum(g); const items = g.items; const main = X.all ? items : items.filter(renseignee); const rest = items.filter(p => !main.includes(p));

        <div class="zc">${['agg', 'att', 'eva'].filter(k => cnt(k)).map(k => `<span class="zk" style="--c:${EFL[k][1]}">${cnt(k)} ${EFL[k][0].toLowerCase()}${cnt(k) > 1 && k !== 'eva' ? 's' : ''}</span>`).join('')}</div></div>

      <ul>${pri.length ? pri.map(p => `<li><a href="#p${p.n}"><span class="dot" style="background:${EFL[p.ef || ''][1]}"></span><b>${esc((p.zone || 'Sans zone').split(' — ')[0])}</b> : ${esc(short(p.note, 170))} <span class="mute">n°${p.n}</span></a></li>`).join('') : '<li class="mute">Pas de constat détaillé.</li>'}</ul></div>`; }).join('');

  const logo = `<svg class="lg" viewBox="0 28 352 130" aria-label="GARÉo"><polyline points="-12,152 249.54,152 275.54,92.6" fill="none" stroke="#C8102E" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/><g stroke-width="6" stroke-linecap="round"><line x1="261.64" y1="68.52" x2="244.64" y2="39.08" stroke="#FF2A43"/><line x1="279.41" y1="65.07" x2="282.19" y2="45.27" stroke="#268A52"/><line x1="295.54" y1="73.29" x2="316.40" y2="53.14" stroke="#2C7E9C"/><line x1="303.07" y1="88.73" x2="342.68" y2="83.16" stroke="#FF2A43"/><line x1="299.62" y1="106.50" x2="319.53" y2="118.00" stroke="#268A52"/><line x1="285.05" y1="118.72" x2="296.33" y2="149.73" stroke="#2C7E9C"/></g><text x="8" y="122" font-family="Manrope,system-ui,sans-serif" font-weight="800" font-size="96" letter-spacing="-4.5" fill="#FFFFFF">GARÉ</text><circle cx="275.54" cy="92.6" r="23.8" fill="#C8102E"/><circle cx="275.54" cy="92.6" r="8.57" fill="#FFFFFF"/><circle cx="244.64" cy="39.08" r="4.5" fill="#FF2A43"/><circle cx="282.19" cy="45.27" r="4.5" fill="#268A52"/><circle cx="316.40" cy="53.14" r="4.5" fill="#2C7E9C"/><circle cx="342.68" cy="83.16" r="4.5" fill="#FF2A43"/><circle cx="319.53" cy="118.00" r="4.5" fill="#268A52"/><circle cx="296.33" cy="149.73" r="4.5" fill="#2C7E9C"/></svg>`;

/* =====================================================================
   ZIP CLASSÉ (sans compression : les photos le sont déjà) — écrit en flux,
   les photos ne sont pas chargées en mémoire. Découpé en parties de 3,5 Go max.
   ===================================================================== */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
async function crcBlob(b) { let c = 0xFFFFFFFF; const rd = b.stream().getReader();
  for (;;) { const {done, value} = await rd.read(); if (done) break; for (let i = 0; i < value.length; i++) c = CRC_T[(c ^ value[i]) & 0xFF] ^ (c >>> 8); }
  return (c ^ 0xFFFFFFFF) >>> 0; }
function dosTime(t) { const d = new Date(t); return {time:(d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), date:((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()}; }
function zipWriter() {
  const parts = [], cd = []; let off = 0;
  return {
    get size() { return off; },
    async add(path, blob, t) {
      const name = new TextEncoder().encode(path), crc = await crcBlob(blob), sz = blob.size, {time, date} = dosTime(t || Date.now());
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true); h.setUint16(10, time, true); h.setUint16(12, date, true);
      h.setUint32(14, crc, true); h.setUint32(18, sz, true); h.setUint32(22, sz, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      parts.push(h.buffer, name, blob);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true); c.setUint16(12, time, true); c.setUint16(14, date, true);
      c.setUint32(16, crc, true); c.setUint32(20, sz, true); c.setUint32(24, sz, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
      cd.push(c.buffer, name); off += 30 + name.length + sz;
    },
    finish() { const cdSize = cd.reduce((s, x) => s + x.byteLength, 0); const n = cd.length / 2;
      const e = new DataView(new ArrayBuffer(22)); e.setUint32(0, 0x06054b50, true); e.setUint16(8, n, true); e.setUint16(10, n, true); e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
      return new Blob([...parts, ...cd, e.buffer], {type:'application/zip'}); }
  };
}
/* Liste des fichiers à écrire, rangés zone / équipement — partagée par le ZIP et le dossier trié */
function plan_rangement(r) {
  const v = r.visite; const groups = groupByZone(r.photos); const out = [];
  groups.forEach((g, gi) => { const zdir = pad(gi + 1) + '_' + ascii(g.niv) + '_' + short(g.zone || 'sans-zone', 48);
    g.items.forEach(p => { const dir = zdir + '/' + (p.eqs.length ? short(p.eqs[0], 48) : '_Vues-generales'); out.push({p, dir, fname:fileName(p, v), zdir}); }); });
  return {groups, out};
}
/* =====================================================================
   EXPORT : compte rendu Word (.docx) au format du modèle CR ACC AREP
   - fiches colorées par effet, pictos d'aléa, photos intégrées, zones
   - points clés / éléments à clarifier pré-remplis depuis les notes
   - synthèse par aléa : plans annotés + tableau, index des photos
   Le squelette (styles AREP, pied de page, pictos) est dans cr/base.json.
   ===================================================================== */
const CRW = (() => {
  const TEAL = '0A6A87', TEAL_L = 'EAF3F6', GREY_L = 'F4F3EF', LINE = 'D9D7D0', INK = '1F1F1E', MUTED = '8C8A84';
  const EFF = {agg:['Aggravant', 'C0392B', 'FBE4E1', 'augmente la vulnérabilité'], att:['Atténuant', '2E8B57', 'E2F2E7', 'réduit la vulnérabilité'],
    eva:['À évaluer', 'A67C00', 'FFF4CC', 'impact à préciser'], inf:['Information', TEAL, TEAL_L, 'élément de contexte']};
  const ALN = {CHA:'Fortes chaleurs', PLU:'Inondation pluviale', FLU:'Inondation fluviale (crue)', NAP:'Remontée de nappe', RGA:'Retrait-gonflement des argiles',
    GLI:'Glissement de terrain', VEN:'Vents forts', SEC:'Sécheresse', FEU:'Feux de végétation', TDC:'Recul du trait de côte', GEL:'Froid / gel'};
  const AL_ORDER = Object.keys(ALN);
  const EMU = 914400, W = 9218;
  const xe = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const sz = n => `<w:sz w:val="${n}"/><w:szCs w:val="${n}"/>`, col = c => `<w:color w:val="${c}"/>`;
  const FM = '<w:rFonts w:ascii="Lato Medium" w:hAnsi="Lato Medium"/>', B = '<w:b/><w:bCs/>', GREY = col('9A988F');
  const CORE = "xmlns:ns0='http://purl.org/dc/elements/1.1/' xmlns:ns1='http://schemas.openxmlformats.org/package/2006/metadata/core-properties'";
  const bind = f => `<w:dataBinding w:prefixMappings="${CORE}" w:xpath="/ns1:coreProperties[1]/ns0:${f}[1]" w:storeItemID="{6C3C8BC8-F283-45AE-878A-BAB7291924A1}"/>`;
  const dmy = t => { const d = new Date(t); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); };

  function make(base) {
    let id = 900000, dp = 9000; const nid = () => ++id;
    const media = [];           // {rid, path, bytes}
    const iconRid = {};
    const addMedia = (bytes, ext) => { const rid = 'rIdM' + (media.length + 1); media.push({rid, path:`media/m${media.length + 1}.${ext}`, bytes}); return rid; };
    const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const icon = c => iconRid[c] || (iconRid[c] = base.icons[c] ? addMedia(b64(base.icons[c]), 'png') : null);
    const phRid = {}; const ph = k => phRid[k] || (phRid[k] = addMedia(b64(base.ph[k]), 'png'));

    const r = (t, rpr = '') => String(t).split('\n').map((l, i) => `<w:r><w:rPr>${rpr}</w:rPr>${i ? '<w:br/>' : ''}<w:t xml:space="preserve">${xe(l)}</w:t></w:r>`).join('');
    const drawing = (rid, cx, cy, name = 'Image') => { const i = ++dp;
      return `<w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="${i}" name="${xe(name)} ${i}"/>`
        + '<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr>'
        + '<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">'
        + `<pic:nvPicPr><pic:cNvPr id="0" name="${xe(name)} ${i}"/><pic:cNvPicPr><a:picLocks noChangeAspect="1"/></pic:cNvPicPr></pic:nvPicPr>`
        + `<pic:blipFill><a:blip r:embed="${rid}"/><a:srcRect/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>`
        + `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing>`; };
    const imgRun = (rid, wIn, hIn, name, pos) => rid ? `<w:r><w:rPr><w:noProof/>${pos != null ? `<w:position w:val="${pos}"/>` : ''}</w:rPr>${drawing(rid, Math.round(wIn * EMU), Math.round(hIn * EMU), name)}</w:r>` : '';
    const pic = (c, h, pos = -5) => imgRun(icon(c), h, h, c, pos);
    const fit = (im, bw, bh) => { const k = Math.min(bw / im.w, bh / im.h); return [im.w * k, im.h * k]; };

    const ccText = (tag, val, rpr = '', binding = '', isPh = true) => `<w:sdt><w:sdtPr><w:rPr>${rpr}</w:rPr><w:alias w:val="${xe(tag)}"/><w:tag w:val="${xe(tag)}"/><w:id w:val="${nid()}"/>${binding}<w:text/></w:sdtPr><w:sdtContent>${r(val, rpr + (isPh ? GREY : ''))}</w:sdtContent></w:sdt>`;
    const ccRich = (tag, ph, rpr = '') => `<w:sdt><w:sdtPr><w:alias w:val="${xe(tag)}"/><w:tag w:val="${xe(tag)}"/><w:id w:val="${nid()}"/></w:sdtPr><w:sdtContent>${r(ph, rpr + GREY)}</w:sdtContent></w:sdt>`;
    const ccDrop = (tag, items, val, rpr = '') => `<w:sdt><w:sdtPr><w:rPr>${rpr}</w:rPr><w:alias w:val="${xe(tag)}"/><w:tag w:val="${xe(tag)}"/><w:id w:val="${nid()}"/><w:dropDownList>${items.map(i => `<w:listItem w:displayText="${xe(i)}" w:value="${xe(i)}"/>`).join('')}</w:dropDownList></w:sdtPr><w:sdtContent>${r(val, rpr)}</w:sdtContent></w:sdt>`;
    const ccPic = (rid, w, h, tag = 'Photo') => `<w:sdt><w:sdtPr><w:alias w:val="${tag}"/><w:tag w:val="photo"/><w:id w:val="${nid()}"/><w:picture/></w:sdtPr><w:sdtContent>${imgRun(rid, w, h, tag)}</w:sdtContent></w:sdt>`;
    const rep = (items, title) => `<w:sdt><w:sdtPr><w:alias w:val="${title}"/><w:tag w:val="${title}"/><w:id w:val="${nid()}"/><w15:repeatingSection><w15:sectionTitle w:val="${title}"/></w15:repeatingSection></w:sdtPr><w:sdtContent>`
      + items.map(x => `<w:sdt><w:sdtPr><w:id w:val="${nid()}"/><w15:repeatingSectionItem/></w:sdtPr><w:sdtContent>${x}</w:sdtContent></w:sdt>`).join('') + '</w:sdtContent></w:sdt>';

    const para = (inner, ppr = '', style = 'Corpsdetexte') => `<w:p><w:pPr><w:pStyle w:val="${style}"/>${ppr}</w:pPr>${inner}</w:p>`;
    const jl = (b = 60, a = 60, line = 264, l = 120, rr = 120, jc = 'left') => `<w:spacing w:before="${b}" w:after="${a}" w:line="${line}" w:lineRule="auto"/><w:ind w:left="${l}" w:right="${rr}"/><w:jc w:val="${jc}"/>`;
    const gap = (h = 180) => para('', `<w:spacing w:before="0" w:after="0" w:line="${h}" w:lineRule="exact"/>`);
    const bd = (side, v = 'single', s = 4, c = LINE) => `<w:${side} w:val="${v}" w:sz="${s}" w:space="0" w:color="${c}"/>`;
    const borders = (top = ['single', 4, LINE], left = ['single', 4, LINE], other = ['single', 4, LINE], iv = ['nil', 0, 'auto']) =>
      '<w:tblBorders>' + bd('top', ...top) + bd('left', ...left) + bd('bottom', ...other) + bd('right', ...other) + bd('insideH', ...other) + bd('insideV', ...iv) + '</w:tblBorders>';
    const NOB = borders(['nil', 0, 'auto'], ['nil', 0, 'auto'], ['nil', 0, 'auto']), GRID = borders(undefined, undefined, undefined, ['single', 4, LINE]);
    const WH = ['single', 24, 'FFFFFF'], WHB = borders(WH, WH, WH, WH);
    const table = (ws, rows, brd = GRID) => `<w:tbl><w:tblPr><w:tblW w:w="${ws.reduce((a, b) => a + b, 0)}" w:type="dxa"/><w:tblInd w:w="1" w:type="dxa"/>${brd}<w:tblLayout w:type="fixed"/>`
      + '<w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="57" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="57" w:type="dxa"/></w:tblCellMar>'
      + `<w:tblLook w:val="0000"/></w:tblPr><w:tblGrid>${ws.map(w => `<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${rows.join('')}</w:tbl>`;
    const cell = (w, content, o = {}) => `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${o.span > 1 ? `<w:gridSpan w:val="${o.span}"/>` : ''}${o.brd ? `<w:tcBorders>${o.brd}</w:tcBorders>` : ''}`
      + `${o.shade ? `<w:shd w:val="clear" w:color="auto" w:fill="${o.shade}"/>` : ''}<w:vAlign w:val="${o.va || 'top'}"/></w:tcPr>${content}</w:tc>`;
    const row = (cells, o = {}) => `<w:tr><w:trPr>${o.split ? '' : '<w:cantSplit/>'}${o.hdr ? '<w:tblHeader/>' : ''}</w:trPr>${cells.join('')}</w:tr>`;
    const thead = (ws, labs) => row(ws.map((w, i) => cell(w, para(r(labs[i], sz(16) + B + col('FFFFFF')), jl(60, 60, 240, 100, 60)), {shade:TEAL})), {hdr:true});
    const H1 = (t, pb = true) => para(r(t), `<w:keepNext/>${pb ? '<w:pageBreakBefore/>' : ''}<w:numPr><w:ilvl w:val="0"/><w:numId w:val="4"/></w:numPr>`, 'Titre1');
    const H2 = (t, pb = false) => para(r(t), `<w:keepNext/>${pb ? '<w:pageBreakBefore/>' : ''}`, 'Titre2');
    const P = (t, o = {}) => para(r(t, o.rpr || ''), (o.num ? `<w:numPr><w:ilvl w:val="0"/><w:numId w:val="${o.num}"/></w:numPr>` : '') + (o.ppr || ''));
    const intro = t => para(r(t, sz(19) + col('5F5D57') + '<w:i/>'), '<w:spacing w:before="0" w:after="200"/>');
    const label = t => r(t.toUpperCase(), FM + sz(14) + col(MUTED) + '<w:spacing w:val="12"/>');
    const TAG = FM + B + sz(17) + col(TEAL);
    const chip = c => pic(c, 0.2) + r(' ' + (ALN[c] || c), TAG);
    return {nid, addMedia, icon, ph, r, imgRun, pic, fit, ccText, ccRich, ccDrop, ccPic, rep, para, jl, gap, bd, borders, NOB, GRID, WHB, table, cell, row, thead, H1, H2, P, intro, label, TAG, chip, media, bind};
  }

  async function build(r0, o) {
    const base = o.base, v = r0.visite, K = make(base);
    const {r, para, jl, gap, bd, borders, table, cell, row, thead, H1, H2, P, intro, label, TAG, chip, pic, imgRun, fit, ccText, ccRich, ccDrop, ccPic, rep} = K;
    const photos = [...r0.photos].sort((a, b) => a.n - b.n);
    const groups = groupByZone(photos);
    const keep = p => o.all || p.star || p.ef || p.note || (p.al && p.al.length);
    const used = AL_ORDER.filter(k => photos.some(p => (p.al || []).includes(k)));
    const imgs = {}; let done = 0;
    for (const p of photos) { if (keep(p) || p.star) { try { const im = await o.getImg(p); if (im) imgs[p.id] = {...im, rid:K.addMedia(im.bytes, 'jpeg')}; } catch (e) {} }
      done++; o.progress && o.progress('Photos', done, photos.length); }
    const out = []; const add = x => out.push(x);
    const date = dmy(v.debut);

    add(para(GARE(FM + B + sz(52) + col(TEAL)), '<w:spacing w:before="0" w:after="300"/>'));
    const cov = photos.find(p => p.star && p.type !== 'video' && imgs[p.id]) || photos.find(p => p.type !== 'video' && imgs[p.id]);
    if (cov) { const [w, h] = fit(imgs[cov.id], 6.4, 3.6); add(para(K.ccPic(imgs[cov.id].rid, w, h, 'Photo de couverture'), '<w:spacing w:before="0" w:after="300"/><w:jc w:val="center"/>')); }
    else add(para(K.ccPic(K.ph('cover'), 6.4, 3.6, 'Photo de couverture'), '<w:spacing w:before="0" w:after="300"/><w:jc w:val="center"/>'));
    const info = (l, val) => para(label(l), jl(80, 0, 240, 140, 60)) + para(val, jl(20, 100, 240, 140, 60));

           ic(iw, 'Indice', ccText('Indice', 'V1', VAL, '', false)), ic(W - 3 * iw, 'Date d’envoi', ccText('Date d’envoi', 'jj/mm/aaaa', VAL))]),
      row([ic(iw, 'Rédigé par', ccText('Rédigé par', v.auteur || 'Prénom NOM', VAL, '', !v.auteur)), ic(iw, 'Vérifié par', ccText('Vérifié par', 'Prénom NOM', VAL)),
           ic(iw, 'N° d’affaire', ccText('N° d’affaire', '1021xxx-00', VAL)), ic(W - 3 * iw, 'Maîtrise d’ouvrage', ccText('MOA', 'SNCF Gares & Connexions', VAL, '', false))])], K.NOB));

    /* ---------- participants ---------- */
    add(H2('Participants', true));
    const PW = [2000, 2300, 1800, 2318, 800];
    const prow = () => row([...PW.slice(0, 4).map((w, i) => cell(w, para(ccText(['Rôle', 'Direction', 'Nom', 'Contact'][i], '…', sz(16)), jl(60, 60, 240, 100, 60)))),

    add(table(PW, [thead(PW, ['Rôle', 'Direction / service', 'Nom Prénom', 'Tél. / e-mail', 'Prés.*']), ...Array.from({length:10}, prow)]));
    add(para(r('* P : présent(e) · A : absent(e) excusé(e) · D : diffusion uniquement', sz(15) + col('7F7F7F')), '<w:spacing w:before="80"/>'));

    /* ---------- 1. contexte ---------- */

    add(para(r('Évaluation de la résilience de la gare de ') + GARE('') + r(' face aux risques climatiques. Celle-ci intègrera les installations bâtimentaires et les équipements qui assurent les fonctions de gare.')));
    add(P('La mission se décompose en 5 volets :'));
    ['Identification des aléas climatiques et analyse de l’exposition', 'Identification des actifs et fonctions essentiels', 'Caractérisation de la sensibilité',
     'Synthèse des vulnérabilités', 'Mesures d’adaptation'].forEach(t => add(P(t, {num:12})));
    add(P(''));
    add(para(r('La visite de site permet d’identifier les installations essentielles à l’exploitation de la gare de ') + GARE('') + r(' et d’évaluer leur vulnérabilité face aux phénomènes climatiques susceptibles de s’intensifier dans les prochaines années sous l’effet du changement climatique.')));
    add(P(`Les investigations ont porté sur (${groups.length} zones, ${photos.length} prises de vue relevées avec GARÉo Relevé ACC) :`));
    add(rep(groups.map((g, i) => P(`${g.zone || 'Sans zone'} (${nivOf(g.niv).label})${i === groups.length - 1 ? '.' : ' ;'}`, {num:7})), 'Zone visitée'));
    add(H2('Comment lire ce compte rendu'));
    add(P('Chaque constat est une fiche. Sa couleur indique son effet sur la vulnérabilité de la gare ; son en-tête, le ou les aléas concernés. Les numéros renvoient aux photos (index en annexe).'));

        {shade:soft, brd:bd('top', 'single', 18, s)}); }))], K.WHB));
    add(gap(160));
    const legA = used.length ? used : AL_ORDER.slice(0, 10); const AW = Math.floor(W / 5);
    const lrows = []; for (let i = 0; i < legA.length; i += 5) { const sl = legA.slice(i, i + 5);
      lrows.push(row(Array.from({length:5}, (_, j) => sl[j] ? cell(AW, para(pic(sl[j], 0.42, 0), jl(120, 30, 240, 0, 0, 'center')) + para(r(ALN[sl[j]], sz(15) + col(INK)), jl(0, 120, 230, 60, 60, 'center')), {shade:GREY_L}) : cell(AW, para('')))));
    }
    add(table(Array(5).fill(AW), lrows, K.WHB));

    /* ---------- 2. points clés ---------- */

    add(intro('Pré-rempli depuis les notes des photos (★ et aggravantes d’abord, 3 par aléa) : à reformuler et réduire à l’essentiel.'));
    const KW = [640, 1860, W - 2500];
    const BUL = '<w:numPr><w:ilvl w:val="0"/><w:numId w:val="7"/></w:numPr><w:spacing w:before="90" w:after="90" w:line="264" w:lineRule="auto"/><w:jc w:val="left"/>';
    const shortTxt = (s, n = 200) => { s = String(s).replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1).replace(/\s\S*$/, '') + '…' : s; };
    const kRows = (used.length ? used : AL_ORDER.slice(0, 10)).map(k => {
      const ps = photos.filter(p => (p.al || []).includes(k) && p.note && (p.ef === 'agg' || p.ef === 'eva' || p.star))

      const bul = ps.length ? ps.map(p => para(r((p.zone ? p.zone.split(' — ')[0] + ' : ' : ''), B) + r(shortTxt(p.note, 150)) + r(` (n° ${p.n})`, col(MUTED)), BUL))
        : [para(ccRich('Point clé', 'Constat principal : une phrase.'), BUL)];
      return row([cell(KW[0], para(pic(k, 0.32, 0), jl(90, 90, 240, 0, 0, 'center')), {shade:TEAL_L, va:'center', brd:bd('right', 'nil', 0, 'auto')}),
                  cell(KW[1], para(r(ALN[k], FM + sz(18) + col(TEAL)), jl(90, 90, 240, 40, 60)), {shade:TEAL_L, va:'center', brd:bd('left', 'nil', 0, 'auto')}),
                  cell(KW[2], rep(bul, 'Point clé'), {va:'center'})], {split:true}); });
    add(table(KW, kRows));

    /* ---------- 3. éléments à clarifier ---------- */
    add(H1('Éléments à clarifier et suites à donner'));
    const QW = [2600, 4618, 2000], TYPES = ['Périmètre / propriété', 'Point technique', 'Document à transmettre', 'Suite à donner (AREP)'];
    const evas = photos.filter(p => p.ef === 'eva' && p.note && (p.star || /\?|vérifi|confirm|précis|à voir|demander|inconnu/i.test(p.note))).slice(0, 12);
    const qrow = p => row([cell(QW[0], para(ccDrop('Type', TYPES, p ? 'Point technique' : '▾ Type', FM + sz(17) + col(TEAL)), jl(70, 70))),
      cell(QW[1], para(p ? r(shortTxt(p.note, 260), sz(18)) + r(` (n° ${p.n}, ${p.zone ? p.zone.split(' — ')[0] : 'sans zone'})`, sz(16) + col(MUTED)) : ccRich('Question', 'Point à clarifier ou document attendu', sz(18)), jl(70, 70))),
      cell(QW[2], para(ccText('Qui', 'MOA / AREP / mainteneur', sz(17)), jl(70, 70)))]);
    add(table(QW, [thead(QW, ['Type', 'Question / document attendu', 'Qui ?']), ...evas.map(qrow), qrow(), qrow()]));
    add(para(r('Ajouter une ligne : se placer en fin de dernière ligne et appuyer sur Tab.', sz(15) + col('7F7F7F')), '<w:spacing w:before="80"/>'));

    /* ---------- fiches ---------- */
    const card = (p, eff) => { const [lab, s, soft] = EFF[eff];
      const brd = borders(['single', 18, s], ['single', 18, s], ['single', 4, LINE]);
      let head = pic(eff, 0.2) + r('  ' + lab.toUpperCase(), FM + B + sz(16) + col(s) + '<w:spacing w:val="12"/>');
      if (p) { const al = (p.al || []).slice().sort((a, b) => AL_ORDER.indexOf(a) - AL_ORDER.indexOf(b));
        head += al.length ? r('     ', sz(16)) + al.map(chip).join(r('   ', sz(16))) : r('     ', sz(16)) + ccDrop('Aléa', [...Object.values(ALN), 'Autre aléa (préciser)'], '▾ Aléa', TAG);
        head += '<w:r><w:tab/></w:r>' + (p.star ? r('★ ', sz(17) + col('C99A06')) : '') + r(`Photo n° ${p.n}${p.type === 'video' ? ' (vidéo)' : ''}`, sz(15) + col('6F6D66'));
      } else head += r('     ', sz(16)) + ccDrop('Aléa', [...Object.values(ALN), 'Autre aléa (préciser)'], '▾ Aléa', TAG);
      const hp = para(head, '<w:keepNext/><w:tabs><w:tab w:val="right" w:pos="8880"/></w:tabs>' + jl(80, 80, 240, 100, 100));
      const title = p ? r(p.eqs && p.eqs.length ? p.eqs.join(' · ') : 'Vue générale', FM + B + sz(20) + col(INK)) : ccText('Titre du constat', 'Titre court du constat', FM + B + sz(20) + col(INK));
      const desc = p && p.note ? r(p.note, sz(19)) : ccRich('Description', p ? 'Constat à rédiger.' : 'Ce qui a été vu ou dit, en deux ou trois phrases courtes. Source si besoin (témoignage, document).', sz(19));
      const text = para(title, jl(120, 40, 260, 170, 140)) + para(desc, jl(40, 120, 288, 170, 140));
      const im = p && imgs[p.id];
      if (p && !im) return table([W], [row([cell(W, hp, {shade:soft})]), row([cell(W, text)])], brd);
      const LW = 4100; let pc;

      return table([LW, W - LW], [row([cell(W, hp, {shade:soft, span:2})]),
        row([cell(LW, para(pc, '<w:spacing w:before="100" w:after="100"/><w:ind w:left="0" w:right="0"/><w:jc w:val="center"/>'), {shade:GREY_L, va:'center'}), cell(W - LW, text, {va:'center'})])], brd); };
    const fiche = (p, eff) => card(p, eff) + gap(200);

    /* ---------- 4. échange en salle ---------- */
    add(H1('Échange en salle'));
    add(intro('Retours de la maîtrise d’ouvrage et des mainteneurs, à l’échelle de la gare.'));
    add(rep(['inf', 'agg', 'att'].map(e => { const [lab, s, soft] = EFF[e];
      return table([W], [row([cell(W, para(pic(e, 0.2) + r('  ' + lab.toUpperCase(), FM + B + sz(16) + col(s)) + r('     ', sz(16)) + ccDrop('Aléa', [...Object.values(ALN), 'Autre aléa (préciser)'], '▾ Aléa', TAG), jl(80, 80, 240, 100, 100)), {shade:soft})]),
        row([cell(W, para(ccText('Titre du constat', 'Titre court du constat', FM + B + sz(20) + col(INK)), jl(120, 40, 260, 170, 140)) + para(ccRich('Description', 'Ce qui a été dit, en deux ou trois phrases courtes.', sz(19)), jl(40, 120, 288, 170, 140)))])],
        borders(['single', 18, s], ['single', 18, s], ['single', 4, LINE])) + gap(200); }), 'Fiche'));

    /* ---------- 5. visite du site ---------- */
    add(H1('Visite du site'));
    add(intro('Une fiche par prise de vue renseignée (effet, aléa, note ou ★). Le bouton + sous une fiche ou une zone en ajoute une vierge.'));
    const zones = groups.map((g, gi) => { const items = g.items.filter(keep); if (!items.length) return '';
      const hd = para(r(`Zone ${pad(gi + 1)} – `, FM + sz(28) + col(TEAL)) + r(g.zone || 'Sans zone', FM + sz(28) + col(TEAL)),
        `<w:keepNext/><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="4" w:color="${TEAL}"/></w:pBdr><w:spacing w:before="360" w:after="60"/>`, 'Titre2');
      const sub = para(r(`${nivOf(g.niv).label} · ${g.items.length} prise${g.items.length > 1 ? 's' : ''} · n° ${g.items[0].n}${g.items.length > 1 ? '–' + g.items[g.items.length - 1].n : ''}`, sz(17) + col(MUTED)), '<w:keepNext/><w:spacing w:before="0" w:after="200"/>');
      return hd + sub + rep(items.map(p => fiche(p, p.ef || 'inf')), 'Fiche'); }).filter(Boolean);
    add(rep(zones, 'Zone'));

    /* ---------- 6. synthèse par aléa ---------- */
    add(H1('Synthèse par aléa'));
    add(intro('Localisation des prises de vue par niveau (couleur = effet, flèche = direction de prise de vue), puis les constats par aléa.'));
    const levels = [...new Set(photos.filter(p => p.pt).map(p => p.pt.n))];
    for (const pl of levels) { let im = null; try { im = await o.planImg(pl, photos.filter(p => p.pt && p.pt.n === pl)); } catch (e) {}
      if (!im) continue; const rid = K.addMedia(im.bytes, 'jpeg'); const [w, h] = fit(im, 6.4, 5.2);
      add(para(r(o.planTitle ? o.planTitle(pl) : pl, FM + sz(18) + col(TEAL)), '<w:keepNext/><w:spacing w:before="200" w:after="80"/>'));
      add(para(imgRun(rid, w, h, 'Plan ' + pl), '<w:spacing w:before="0" w:after="60"/><w:jc w:val="center"/>')); }
    add(para(pic('agg', 0.16) + r(' aggravant   ', sz(15)) + pic('att', 0.16) + r(' atténuant   ', sz(15)) + pic('eva', 0.16) + r(' à évaluer   ', sz(15)) + r('●', sz(15) + col('1A1A1A')) + r(' sans effet   ', sz(15)) + r('contour doré = ★', sz(15) + col(MUTED)), '<w:spacing w:before="0" w:after="200"/><w:jc w:val="center"/>'));
    const SW = [640, 1860, 4318, 2400];
    const sRows = used.map(k => { const ps = photos.filter(p => (p.al || []).includes(k));

        .map(p => { const [w, h] = fit(imgs[p.id], 1.05, 0.8); return imgRun(imgs[p.id].rid, w, h, 'n' + p.n); }).join(r(' '));
      return row([cell(SW[0], para(pic(k, 0.3, 0), jl(90, 90, 240, 0, 0, 'center')), {shade:TEAL_L, va:'center', brd:bd('right', 'nil', 0, 'auto')}),
        cell(SW[1], para(r(ALN[k], FM + sz(17) + col(TEAL)), jl(90, 90, 240, 40, 60)), {shade:TEAL_L, va:'center', brd:bd('left', 'nil', 0, 'auto')}),
        cell(SW[2], para(r(`${ps.length} prise${ps.length > 1 ? 's' : ''}`, B + sz(17)) + (cnt ? r(' — ', sz(16)) + cnt : ''), jl(90, 30)) + para(r(zs.join(' · '), sz(16) + col('4A4843')), jl(30, 30))
          + para(r('n° ' + ps.map(p => p.n).join(', '), sz(15) + col(MUTED)), jl(30, 90))),
        cell(SW[3], para(thumbs || r('—', col(MUTED)), jl(90, 90, 240, 60, 60, 'center')), {va:'center'})]); });
    add(table(SW, [row([cell(SW[0] + SW[1], para(r('Aléa', sz(16) + B + col('FFFFFF')), jl(60, 60, 240, 100, 60)), {shade:TEAL, span:2}),
      cell(SW[2], para(r('Constats et zones concernées', sz(16) + B + col('FFFFFF')), jl(60, 60, 240, 100, 60)), {shade:TEAL}),
      cell(SW[3], para(r('Photos', sz(16) + B + col('FFFFFF')), jl(60, 60, 240, 100, 60)), {shade:TEAL})], {hdr:true}), ...sRows]));
    if (!used.length) add(P('Aucun aléa renseigné sur les photos.'));

    /* ---------- annexe : index ---------- */
    add(H1('Annexe – Index des prises de vue'));
    const IW = [520, 700, 2300, 2300, 1100, 2298];
    const t = (s, rpr = '') => para(r(s, sz(14) + rpr), jl(30, 30, 220, 60, 40));
    add(table(IW, [row(['N°', 'Heure', 'Zone', 'Équipements', 'Effet', 'Aléas · note'].map((x, i) => cell(IW[i], para(r(x, sz(14) + B + col('FFFFFF')), jl(40, 40, 220, 60, 40)), {shade:TEAL})), {hdr:true}),
      ...photos.map(p => row([cell(IW[0], t(String(p.n) + (p.star ? ' ★' : ''), B)), cell(IW[1], t(hm(p.t))), cell(IW[2], t((p.zone || '—') + ' · ' + nivOf(p.niv).label)),
        cell(IW[3], t(p.eqs && p.eqs.length ? p.eqs.join(' · ') : 'Vue générale')), cell(IW[4], p.ef ? t(EFF[p.ef][0], B + col(EFF[p.ef][1])) : t('—')),
        cell(IW[5], t([(p.al || []).map(k => ALN[k] || k).join(', '), p.note ? shortTxt(p.note, 160) : ''].filter(Boolean).join(' — ') || '—'))]))]));

    /* ---------- paquet ---------- */
    const body = base.head + out.join('') + base.sect + '</w:body></w:document>';
    const zw = zipWriter(); const enc = s => new Blob([s], {type:'application/xml'});
    const core = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:dcmitype="http://purl.org/dc/dcmitype/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${xe(v.gare)}</dc:title><dc:subject>${date}</dc:subject><dc:creator>${xe(v.auteur || 'AREP')}</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().slice(0, 19)}Z</dcterms:created></cp:coreProperties>`;
    await zw.add('[Content_Types].xml', enc(base.files['[Content_Types].xml']));
    await zw.add('_rels/.rels', enc(base.files['_rels/.rels']));
    await zw.add('docProps/core.xml', enc(core));
