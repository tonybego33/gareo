<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#1A1A1A">
<title>GARÉo · prototype à usage interne</title>
<link rel="icon" href="gareo-192.png">
<link rel="apple-touch-icon" href="gareo-apple-180.png">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Manrope:wght@800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1F24;--bg:#F2F3F5;--line:#E2E5E9;--mute:#6B7280;--red:#C8102E;--teal:#0A6A87}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Lato,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.hero{position:relative;background:var(--ink);color:#fff;min-height:min(58vh,520px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 22px 72px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.6;
  background-image:radial-gradient(circle at 50% 20%,rgba(200,16,46,.22),transparent 55%),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 48px),radial-gradient(rgba(255,255,255,.06) 1.2px,transparent 1.6px);
  background-size:auto,auto,26px 26px}
.hero > *{position:relative}
.gareo-logo{height:clamp(96px,17vw,150px);width:auto;display:block}
.kick{font-size:11.5px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#FF5A6E;margin-bottom:26px}
.hero p{margin-top:26px;font-size:17px;line-height:1.5;opacity:.8;max-width:520px}
.badge{margin-top:22px;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:7px 14px;color:#F6DCA0}
.badge i{width:7px;height:7px;border-radius:50%;background:#F2B705;box-shadow:0 0 0 3px rgba(242,183,5,.18)}
/* GARÉo - logo hub animé (écran d'accès). 100% SVG + CSS, aucun JS. */
.gareo-logo .g-wrap { animation: g-loop 4.8s linear infinite; }
@keyframes g-loop { 0% { opacity: 0; } 4% { opacity: 1; } 94% { opacity: 1; } 100% { opacity: 0; } }
.gareo-logo .g-feed { stroke-dasharray: 1; stroke-dashoffset: 1; animation: g-draw 4.8s ease-out infinite; }
@keyframes g-draw { 0% { stroke-dashoffset: 1; } 30% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
.gareo-logo .g-spoke { stroke-dasharray: 1; stroke-dashoffset: 1; animation: g-spoke 4.8s ease-out infinite; }
@keyframes g-spoke { 0%, 9% { stroke-dashoffset: 1; } 32% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
.gareo-logo .g-pop { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: g-pop 4.8s cubic-bezier(.34,1.4,.5,1) infinite; }
@keyframes g-pop { 0%, 30% { transform: scale(0); } 40% { transform: scale(1.25); } 46% { transform: scale(1); } 100% { transform: scale(1); } }
.gareo-logo .g-node { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: g-node 4.8s cubic-bezier(.34,1.4,.5,1) infinite; }
@keyframes g-node { 0%, 28% { transform: scale(0); } 38% { transform: scale(1.18); } 44% { transform: scale(1); } 100% { transform: scale(1); } }
.gareo-logo .g-star { transform-box: fill-box; transform-origin: center; opacity: 0; animation: g-star 4.8s ease-in-out infinite; }
@keyframes g-star { 0%, 34% { transform: scale(0) rotate(0); opacity: 0; } 40% { transform: scale(1) rotate(0); opacity: 1; } 46% { transform: scale(.5); opacity: .5; } 52% { transform: scale(1.06) rotate(45deg); opacity: 1; } 64% { transform: scale(.2) rotate(45deg); opacity: 0; } 100% { opacity: 0; } }
.gareo-logo .g-ring { transform-box: fill-box; transform-origin: center; opacity: 0; animation: g-ring 4.8s ease-out infinite; }
@keyframes g-ring { 0%, 34% { transform: scale(.5); opacity: 0; } 40% { opacity: .8; } 60% { transform: scale(2.6); opacity: 0; } 100% { opacity: 0; } }

@media (prefers-reduced-motion: reduce){.gareo-logo *{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}.gareo-logo .g-star,.gareo-logo .g-ring{opacity:0!important}}
main{flex:1;max-width:920px;width:100%;margin:0 auto;padding:56px 22px 40px}
h2.sec{font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);text-align:center;margin-bottom:28px}
.apps{display:flex;flex-wrap:wrap;justify-content:center;gap:34px 42px}
.app{display:flex;flex-direction:column;align-items:center;gap:12px;text-decoration:none;color:inherit;width:150px;text-align:center}
.app .ic{width:124px;height:124px;border-radius:28px;display:block;box-shadow:0 16px 30px -12px var(--s);transition:transform .18s cubic-bezier(.34,1.4,.5,1),box-shadow .18s}
.app .ic svg{width:100%;height:100%;display:block;border-radius:28px}
.app:hover .ic,.app:focus-visible .ic{transform:translateY(-4px);box-shadow:0 22px 36px -12px var(--s)}
.app:active .ic{transform:scale(.96)}
.app small{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.app .nm{display:flex;flex-direction:column;align-items:center;gap:3px}
.app small{display:block}.app b{display:block;font-size:17px;font-weight:900}
.app.soon .ic{background:transparent;border:2px dashed #C9CED4;box-shadow:none;display:flex;align-items:center;justify-content:center}
.app.soon .ic span{font-size:44px;font-weight:300;color:#AEB4BC}
.app.soon b{color:#9AA1AA;font-weight:700}
.info{max-width:920px;margin:26px auto 0;padding:0 22px 40px}
.info .box{border-top:1px solid var(--line);padding-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:26px 40px}
.info h3{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;color:#4A4741}
.info p{font-size:13.5px;line-height:1.55;color:#5C5750}
.info .warn{grid-column:1/-1;background:#FFF6DC;border:1px solid #F0DDA0;border-radius:12px;padding:14px 18px;font-size:14px;line-height:1.5;color:#5A4600}
footer{text-align:center;font-size:12px;color:var(--mute);padding:0 16px 30px}
@media(max-width:640px){.info .box{grid-template-columns:1fr}}
@media(max-width:520px){.hero{min-height:auto;padding:52px 18px 56px}.app{width:100px}.app .ic{width:92px;height:92px;border-radius:21px}.app .ic svg{border-radius:21px}.app b{font-size:15px}.apps{gap:26px 16px;flex-wrap:nowrap}.badge{font-size:10.5px;letter-spacing:.03em;padding:7px 12px}.kick{font-size:10.5px;letter-spacing:.12em}}
</style>
</head>
<body>
<section class="hero">

  <svg class="gareo-logo" role="img" aria-label="GARÉo" viewBox="0 28 352 130"><g class="g-wrap">
<polyline class="g-feed" points="-12,152 249.54,152 275.54,92.6" fill="none" stroke="#C8102E" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
<line class="g-spoke" x1="261.64" y1="68.52" x2="244.64" y2="39.08" stroke="#FF2A43" stroke-width="6" stroke-linecap="round" pathLength="1"/>
<line class="g-spoke" x1="279.41" y1="65.07" x2="282.19" y2="45.27" stroke="#268A52" stroke-width="6" stroke-linecap="round" pathLength="1"/>
<line class="g-spoke" x1="295.54" y1="73.29" x2="316.40" y2="53.14" stroke="#2C7E9C" stroke-width="6" stroke-linecap="round" pathLength="1"/>
<line class="g-spoke" x1="303.07" y1="88.73" x2="342.68" y2="83.16" stroke="#FF2A43" stroke-width="6" stroke-linecap="round" pathLength="1"/>
<line class="g-spoke" x1="299.62" y1="106.50" x2="319.53" y2="118.00" stroke="#268A52" stroke-width="6" stroke-linecap="round" pathLength="1"/>
<line class="g-spoke" x1="285.05" y1="118.72" x2="296.33" y2="149.73" stroke="#2C7E9C" stroke-width="6" stroke-linecap="round" pathLength="1"/>
<text x="8" y="122" font-family="Manrope,system-ui,sans-serif" font-weight="800" font-size="96" letter-spacing="-4.5" fill="#FFFFFF">GARÉ</text>
<g class="g-node"><circle cx="275.54" cy="92.6" r="23.8" fill="#C8102E"/><circle cx="275.54" cy="92.6" r="8.57" fill="#FFFFFF"/></g>
<circle class="g-pop" cx="244.64" cy="39.08" r="4.5" fill="#FF2A43"/><circle class="g-pop" cx="282.19" cy="45.27" r="4.5" fill="#268A52"/><circle class="g-pop" cx="316.40" cy="53.14" r="4.5" fill="#2C7E9C"/>
<circle class="g-pop" cx="342.68" cy="83.16" r="4.5" fill="#FF2A43"/><circle class="g-pop" cx="319.53" cy="118.00" r="4.5" fill="#268A52"/><circle class="g-pop" cx="296.33" cy="149.73" r="4.5" fill="#2C7E9C"/>
<circle class="g-ring" cx="275.54" cy="92.6" r="23.8" fill="none" stroke="#C8102E" stroke-width="3"/>
<path class="g-star" d="M275.54,54.80 Q281.59,86.55 313.34,92.6 Q281.59,98.65 275.54,130.40 Q269.49,98.65 237.74,92.6 Q269.49,86.55 275.54,54.80 Z" fill="#FFFFFF"/>
</g></svg>
  <p>Relever, localiser et restituer ce qu'on observe en gare : sur le terrain au téléphone, puis au bureau jusqu'au livrable.</p>
</section>
<main>
  <h2 class="sec">Modules</h2>
  <div class="apps">
    <a class="app" href="serm-hdf/" style="--c:#C8102E;--s:rgba(200,16,46,.55)"><span class="ic"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="gs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8344B"/><stop offset="1" stop-color="#9E0B24"/></linearGradient></defs>
<rect width="64" height="64" rx="15" fill="url(#gs)"/><rect width="64" height="32" rx="15" fill="#fff" opacity=".07"/>
<g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"><path d="M9 47 H25 L30.5 38" stroke-width="3.4"/>
<g stroke-width="2.8"><path d="M31.3 24.2 27.8 17.6"/><path d="M36.6 23.3 37.4 15.4"/><path d="M41.3 26.2 47.6 20.6"/><path d="M43.2 31.6 51.8 31"/><path d="M41.4 37 47.7 41.6"/><path d="M36.9 39.7 39.6 47.6"/></g>
<circle cx="35" cy="31.5" r="7.6" stroke-width="3.4"/></g><circle cx="35" cy="31.5" r="2.8" fill="#fff"/>
<g fill="#fff"><circle cx="27.2" cy="16.5" r="2.5"/><circle cx="37.5" cy="14.2" r="2.5"/><circle cx="48.5" cy="19.8" r="2.5"/><circle cx="53" cy="30.9" r="2.5"/><circle cx="48.7" cy="42.3" r="2.5"/><circle cx="40" cy="48.8" r="2.5"/></g></svg></span><span class="nm"><small>GARÉo</small><b>SERM HDF</b></span></a>
    <a class="app" href="releve-acc/" style="--c:#0A6A87;--s:rgba(10,106,135,.55)"><span class="ic"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A8DB0"/><stop offset="1" stop-color="#064B60"/></linearGradient></defs>
<rect width="64" height="64" rx="15" fill="url(#ga)"/><rect width="64" height="32" rx="15" fill="#fff" opacity=".07"/>
<path d="M32 53.5c0 0-14.5-14.2-14.5-25a14.5 14.5 0 0 1 29 0c0 10.8-14.5 25-14.5 25z" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round"/>
<circle cx="32" cy="28.5" r="5.6" fill="none" stroke="#fff" stroke-width="3.4"/></svg></span><span class="nm"><small>GARÉo</small><b>Relevé ACC</b></span></a>
    <div class="app soon"><span class="ic"><span>+</span></span><span class="nm"><small>GARÉo</small><b>À venir</b></span></div>
  </div>
</main>

<footer>GARÉo · prototype · usage interne exclusivement · ne pas diffuser le lien</footer>
<script>
/* l'ancienne appli était installée à la racine : on force la mise à jour de son service worker (qui se retire tout seul) */
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (new URL(r.scope).pathname === location.pathname.replace(/index\.html$/, '')) r.update(); }));
</script>
</body>
</html>
